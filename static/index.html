<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Explainer</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-wand-sparkles glow-icon"></i>
                <h1>Gemini <span>Explainer</span></h1>
            </div>
            <p class="subtitle">Briefly explain anything with Google's Gemini 2.0 Flash</p>
        </header>

        <main>
            <div class="input-section">
                <div class="input-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="topicInput" placeholder="Enter a topic (e.g., Quantum Computing, Photosynthesis)..." autocomplete="off">
                    <button id="explainBtn">
                        <span>Explain</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <div class="output-section" id="outputSection">
                <div class="card glass">
                    <div class="card-header">
                        <span class="dot red"></span>
                        <span class="dot yellow"></span>
                        <span class="dot green"></span>
                        <span class="header-title" id="cardTitle">Awaiting Input...</span>
                    </div>
                    <div class="card-body">
                        <div id="loading" class="hidden">
                            <div class="spinner"></div>
                            <p>Analyzing with Gemini...</p>
                        </div>
                        <div id="resultContent" class="hidden">
                            <!-- Response will go here -->
                        </div>
                        <div id="placeholder" class="placeholder-content">
                            <i class="fa-solid fa-brain placeholder-icon"></i>
                            <p>Type a topic above to begin</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="status-bar">
                <span class="status-item"><i class="fa-solid fa-circle status-green"></i> Model: Gemini-2.0-Flash</span>
                <span class="status-item"><i class="fa-solid fa-bolt"></i> Latency: <span id="latency">-</span></span>
            </div>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
